name: Run LemonadeClient Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux with source installation
          - os: ubuntu-latest
            install-type: 'source'
            test-name: 'Linux Source'
          
          # Windows with source installation
          - os: windows-latest
            install-type: 'source'
            test-name: 'Windows Source'

    name: ${{ matrix.test-name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Install source dependencies
      run: |
        pip install -e .

    - name: Run unit tests
      run: |
        python test/lemonade_client_unit.py

    - name: Download and install lemonade-server
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "Downloading lemonade-server MSI installer..."
          curl -L -o lemonade-server-minimal.msi https://github.com/lemonade-sdk/lemonade/releases/latest/download/lemonade-server-minimal.msi
          echo "Installing lemonade-server in silent mode..."
          msiexec //i lemonade-server-minimal.msi //qn //norestart
          echo "Waiting for installation to complete..."
          sleep 10
        else
          echo "Getting latest release info..."
          # Get the latest release tag and find the .deb asset
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/lemonade-sdk/lemonade/releases/latest)
          DEB_URL=$(echo "$LATEST_RELEASE" | grep -o 'https://github.com/lemonade-sdk/lemonade/releases/download/[^"]*\.deb' | head -1)
          
          if [ -z "$DEB_URL" ]; then
            echo "Error: Could not find .deb package in latest release"
            echo "Skipping lemonade-server installation for Linux tests"
          else
            echo "Downloading lemonade-server .deb package from: $DEB_URL"
            curl -L -o lemonade-server.deb "$DEB_URL"
            echo "Installing lemonade-server..."
            sudo dpkg -i lemonade-server.deb || sudo apt-get install -f -y
          fi
        fi
        echo "lemonade-server installation complete"

    - name: Run integration tests
      run: |
        python test/lemonade_client_integration.py
      env:
        PYTHONUNBUFFERED: 1

    - name: Test integration example
      run: |
        python examples/lemonade_client_integration_example.py
      env:
        PYTHONUNBUFFERED: 1